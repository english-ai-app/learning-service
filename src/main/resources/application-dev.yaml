server:
  port: 9008

spring:
  application:
    name: learning_service

  datasource:
    url: jdbc:mysql://localhost:3306/learning_service
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

storage:
  provider: ${LEARNING_STORAGE_PROVIDER:local}
  local-root: ${LEARNING_STORAGE_LOCAL_ROOT:./storage}
  public-base-url: ${LEARNING_STORAGE_PUBLIC_BASE_URL:http://192.168.1.78:8000/api/learning/media}
  max-file-size-bytes: 10485760
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  minio-bucket: ${MINIO_BUCKET:learning-service}
  s3-endpoint: ${S3_ENDPOINT:https://s3.us-east-1.amazonaws.com}
  s3-region: ${S3_REGION:us-east-1}
  s3-access-key: ${S3_ACCESS_KEY:}
  s3-secret-key: ${S3_SECRET_KEY:}
  s3-bucket: ${S3_BUCKET:learning-service}
  s3-public-base-url: ${S3_PUBLIC_BASE_URL:}
  presigned-url-expiry-seconds: 900

eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9092

  zookeeper:
    connection:
      string: localhost:2181

eventuate:
  local:
    kafka:
      consumer:
        properties:
          auto.offset.reset: latest
          session.timeout.ms: 45000
          heartbeat.interval.ms: 15000
          max.poll.interval.ms: 600000
          request.timeout.ms: 40000
          retry.backoff.ms: 5000
          max.poll.records: 50
          enable.auto.commit: true
  database:
    schema: learning_service
